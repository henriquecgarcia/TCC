<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LCARS Robot Control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="lcars">
    <aside class="rail">
      <div class="pill big"></div>
      <div class="pill"></div>
      <div class="pill small"></div>
    </aside>
    <section class="panel">
      <header>
        <h1>ESP32 AUTONOMOUS ROVER</h1>
        <span id="status">DESCONECTADO</span>
      </header>
      <div class="grid">
        <canvas id="map" width="640" height="640"></canvas>
        <div class="controls">
          <h2>MOVIMENTO MANUAL</h2>
          <button id="forward">VÁ PARA FRENTE</button>
          <button id="backward">VÁ PARA TRÁS</button>
          <button id="turnRight90">VIRE 90° PARA DIREITA</button>
          <button id="turnLeft90">VIRE 90° PARA ESQUERDA</button>
          <h2>NAVEGAÇÃO</h2>
          <label>Destino X <input id="gx" type="number" min="0" max="31" value="5"></label>
          <label>Destino Y <input id="gy" type="number" min="0" max="31" value="5"></label>
          <button id="sendGoal">ENVIAR DESTINO</button>
          <button id="stop">PARADA</button>
          <button id="clearDynamic">LIMPAR OBSTÁCULOS</button>
          <h2>POSE</h2>
          <label>X (m) <input id="px" type="number" step="0.01" value="0.05"></label>
          <label>Y (m) <input id="py" type="number" step="0.01" value="0.05"></label>
          <label>THETA (rad) <input id="pt" type="number" step="0.01" value="0"></label>
          <button id="setPose">DEFINIR POSE</button>
          <pre id="telemetry">Aguardando telemetria...</pre>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
