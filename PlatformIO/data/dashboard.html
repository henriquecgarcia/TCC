<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Painel do Carrinho</title>
	<style>
		body {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b);
			color: #fff;
		}
		.container {
			background: rgba(255, 255, 255, 0.1);
			padding: 2rem 3rem;
			border-radius: 1.5rem;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
			text-align: center;
			min-width: 700px;
			/* max-width: 850px; */
			width: 90%;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border: 1px solid rgba(255, 255, 255, 0.18);
			transition: transform 0.3s ease;
		}
		h1 {
			font-size: 2.5rem;
			margin-bottom: 0.5rem;
		}
		.speed {
			font-size: 3.5rem;
			font-weight: bold;
			margin: 0.5rem 0;
		}
		.info {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 1rem;
			margin-top: 1.5rem;
		}
		.card {
			background: rgba(255, 255, 255, 0.2);
			padding: 1rem;
			border-radius: 1rem;
			flex: 1;
			min-width: 150px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
			text-align: center;
			transition: transform 0.2s;
		}
		.card h2 {
			margin: 0;
			font-size: 1.25rem;
			margin-bottom: 0.5rem;
		}
		
		/* --- ESTILO DOS SENSORES FIXOS --- */
		.sensor-data {
			display: flex;
			flex-direction: column;
			align-items: center;
			font-size: 1.1rem;
		}
		.axis {
			display: flex;
			justify-content: space-between;
			width: 110px; /* Largura fixa para manter no lugar */
			margin: 2px 0;
		}
		.val {
			font-family: 'Courier New', Courier, monospace; /* Fonte monoespaçada */
			text-align: right;
			width: 70px; /* Largura fixa para os números */
			display: inline-block;
			font-weight: bold;
		}

		/* --- ESTILO DO JOYSTICK (D-PAD) --- */
		.controls-wrapper {
			margin-top: 2rem;
		}
		div.buttons {
			display: grid;
			grid-template-areas:
				". up ."
				"left stop right"
				". down .";
			gap: 15px;
			justify-content: center;
		}
		div.buttons button {
			background-color: #4CAF50;
			color: white;
			border: none;
			border-radius: 15px;
			width: 80px;
			height: 80px;
			cursor: pointer;
			font-size: 1rem;
			font-weight: bold;
			box-shadow: 0 4px 6px rgba(0,0,0,0.3);
			transition: background-color 0.3s, transform 0.1s;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		div.buttons button:active {
			transform: scale(0.95); /* Efeito de apertar o botão */
		}
		.btn-up { grid-area: up; }
		.btn-down { grid-area: down; }
		.btn-left { grid-area: left; }
		.btn-right { grid-area: right; }
		.btn-stop { 
			grid-area: stop; 
			background-color: #E53935 !important; /* Vermelho para o Stop */
			border-radius: 50% !important; /* Botão de stop redondo */
		}
		.btn-stop:hover { background-color: #D32F2F !important; }
		.btn-up:hover, .btn-down:hover, .btn-left:hover, .btn-right:hover {
			background-color: #45a049;
		}
	</style>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
	<div class="container">
		<h1>Status do Carrinho</h1>
		<div class="speed" id="speed"><span id="motorD">--</span> | <span id="motorE">--</span> RPM</div>
		
		<div class="info">
			<div class="card">
				<h2>Direção</h2>
				<p id="direction" style="font-size: 1.5rem; font-weight:bold; margin-top:1rem;">--</p>
			</div>
			<div class="card">
				<h2>PID Atual</h2>
				<p id="counters" style="font-size: 1.5rem; font-weight:bold; margin-top:1rem;">
					<span id="counterD">--</span> | <span id="counterE">--</span>
				</p>
			</div>
			
			<div class="card">
				<h2>Giroscópio (°/s)</h2>
				<div class="sensor-data">
					<div class="axis"><span>X:</span> <span id="gyro-x" class="val">--</span></div>
					<div class="axis"><span>Y:</span> <span id="gyro-y" class="val">--</span></div>
					<div class="axis"><span>Z:</span> <span id="gyro-z" class="val">--</span></div>
				</div>
			</div>
			
			<div class="card">
				<h2>Aceleração (m/s²)</h2>
				<div class="sensor-data">
					<div class="axis"><span>X:</span> <span id="accel-x" class="val">--</span></div>
					<div class="axis"><span>Y:</span> <span id="accel-y" class="val">--</span></div>
					<div class="axis"><span>Z:</span> <span id="accel-z" class="val">--</span></div>
				</div>
			</div>
		</div>
	</div>

	<div class="controls-wrapper">
		<div class="buttons">
			<button class="btn-up" onclick="sendMessage('forward')">Frente</button>
			<button class="btn-left" onclick="sendMessage('left')">Esq</button>
			<button class="btn-stop" onclick="sendMessage('stop')">Parar</button>
			<button class="btn-right" onclick="sendMessage('right')">Dir</button>
			<button class="btn-down" onclick="sendMessage('backward')">Trás</button>
		</div>
	</div>

	<script>
		if (!window.WebSocket) {
			alert('Seu navegador não suporta WebSockets. Por favor, use um navegador moderno como Chrome, Firefox ou Edge.');
			async function fetchData() {
				try {
					const res = await fetch('/data');
					if (!res.ok) {
						throw new Error('Erro ao buscar dados: ' + data.message);
					}
					const data = await res.json();
					if (!data || !data.motorD) {
						throw new Error('Dados inválidos recebidos');
					}

					document.getElementById('motorD').innerHTML = data.motorD.rpm;
					document.getElementById('motorE').innerHTML = data.motorE.rpm;

					if (data.isMoving) {
						document.getElementById('direction').innerHTML = data.movement;
					} else {
						document.getElementById('direction').innerHTML = 'Parado';
					}
					document.getElementById('counterD').innerHTML = data.motorD.pidOutput;
					document.getElementById('counterE').innerHTML = data.motorE.pidOutput;

					let mpu = data.MPU6050;
					if(mpu) {
						document.getElementById('gyro-x').innerHTML = parseFloat(mpu.gyroX).toFixed(1);
						document.getElementById('gyro-y').innerHTML = parseFloat(mpu.gyroY).toFixed(1);
						document.getElementById('gyro-z').innerHTML = parseFloat(mpu.gyroZ).toFixed(1);

						document.getElementById('accel-x').innerHTML = parseFloat(mpu.accX).toFixed(2);
						document.getElementById('accel-y').innerHTML = parseFloat(mpu.accY).toFixed(2);
						document.getElementById('accel-z').innerHTML = parseFloat(mpu.accZ).toFixed(2);
					}
				} catch (err) {
					console.error('Erro ao buscar dados:', err);
				}
			}

			document.querySelector('.controls-wrapper').style.display = 'none'; // Esconde os botões se WebSocket não estiver disponível
			document.getElementById('speed').innerHTML = 'WebSocket não suportado. Atualizando via HTTP...';
			fetchData();
			setInterval(fetchData, 5000);
		} else {
			const gateway = `ws://${window.location.hostname}/car`;
			let websocket;
			let attempts = 0;

			function initWebSocket() {
				console.log('Tentando abrir uma conexão WebSocket...');
				websocket = new WebSocket(gateway);
				websocket.onopen = onOpen;
				websocket.onclose = onClose;
				websocket.onmessage = onMessage;
				websocket.onerror = function(event) {
					console.error('Erro na conexão WebSocket:', event);
					document.getElementById('speed').innerHTML = 'Erro na conexão...';
				};
				attempts++;
			}

			function onOpen(event) {
				console.log('Conexão aberta.');
				document.getElementById('speed').innerHTML = 'Conectado!';
			}

			function onClose(event) {
				console.log('Conexão fechada.');
				websocket = null;
				if (attempts <= 5) {
					setTimeout(initWebSocket, 2000);
				} else {
					document.getElementById('speed').innerHTML = 'Muitas tentativas. Verifique o ESP32.';
				}
			}

			function onMessage(event) {
				const data = JSON.parse(event.data);

				if (data.ready) {
					document.getElementById('speed').innerHTML = 'Conectado!';
					setTimeout(() => { sendMessage("status"); }, 1000);
				}
				if (data.status) {
					$("#direction").html(data.status === 'stopped' ? 'Parado' : (data.direction || 'Desconhecido'));
				}
				if (data.motorD) {
					$("#motorD").html(data.motorD.rpm || '--');
					$("#counterD").html(data.motorD.pidOutput || '--');
				}
				if (data.motorE) {
					$("#motorE").html(data.motorE.rpm || '--');
					$("#counterE").html(data.motorE.pidOutput || '--');
				}

				// Atualizando Giroscópio fixo
				if (data.gyro) {
					$("#gyro-x").html(data.gyro.x !== undefined ? parseFloat(data.gyro.x).toFixed(1) : '--');
					$("#gyro-y").html(data.gyro.y !== undefined ? parseFloat(data.gyro.y).toFixed(1) : '--');
					$("#gyro-z").html(data.gyro.z !== undefined ? parseFloat(data.gyro.z).toFixed(1) : '--');
				}

				// Atualizando Acelerômetro fixo
				if (data.accel) {
					$("#accel-x").html(data.accel.x !== undefined ? parseFloat(data.accel.x).toFixed(2) : '--');
					$("#accel-y").html(data.accel.y !== undefined ? parseFloat(data.accel.y).toFixed(2) : '--');
					$("#accel-z").html(data.accel.z !== undefined ? parseFloat(data.accel.z).toFixed(2) : '--');
				}
			}

			function sendMessage(command) {
				if (websocket && websocket.readyState === WebSocket.OPEN) {
					websocket.send(command);
				} else {
					console.error('WebSocket fechado. Comando ignorado:', command);
				}
			}

			window.addEventListener('load', initWebSocket);
		}
	</script>
</body>
</html>
