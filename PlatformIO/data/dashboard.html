<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Painel do Carrinho</title>
	<style>
		body {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b);
			color: #fff;
		}
		.container {
			background: rgba(255, 255, 255, 0.1);
			padding: 2rem 3rem;
			border-radius: 1.5rem;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
			text-align: center;
			max-width: 800px;
			width: 90%;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border: 1px solid rgba(255, 255, 255, 0.18);
			transition: transform 0.3s ease;
		}
		h1 {
			font-size: 2.5rem;
			margin-bottom: 0.5rem;
		}
		.speed {
			font-size: 4rem;
			font-weight: bold;
			margin: 0.5rem 0;
		}
		.info {
			display: flex;
			justify-content: space-between;
			margin-top: 1.5rem;
		}
		.card {
			background: rgba(255, 255, 255, 0.2);
			display: inline-block;
			padding: 1rem;
			border-radius: 1rem;
			flex: 1;
			margin: 0 0.5rem;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
			text-align: center;
			transition: transform 0.2s;
		}
		.card h2 {
			margin: 0;
			font-size: 1.25rem;
		}
		.card p {
			margin: 0.5rem 0 0;
			font-size: 1.5rem;
		}
		div.button, button {
			background-color: #4CAF50;
			color: white;
			border: none;
			border-radius: 0.5rem;
			padding: 0.5rem 1rem;
			cursor: pointer;
			font-size: 1rem;
			margin-top: 1rem;
			transition: background-color 0.3s, transform 0.2s;
		}
		button:hover {
			background-color: #45a049;
			transform: scale(1.05);
		}
		div.button .disabled {
			background-color: rgba(0, 0, 0, 0);
			cursor: not-allowed;
		}
		div.buttons {
			display: grid;
			/* Use grid layout for buttons 3x3 */
			grid-template-rows: repeat(3, minmax(50px, 1fr));
			grid-template-columns: repeat(3, minmax(150px, 1fr));
			gap: 1rem;
			margin-top: 1.5rem;
		}
	</style>

	<!-- Includindo bibliotecas necessárias -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
	<div class="container">
		<h1>Status do Carrinho</h1>
		<div class="speed" id="speed"><span id="motorD">--</span> | <span id="motorE">--</span> RPM</div>
		<div class="info">
			<div class="card">
				<h2>Direção</h2>
				<p id="direction">--</p>
			</div>
			<div class="card">
				<h2>PID Atual</h2>
				<p id="counters"><span id="counterD"></span> | <span id="counterE"></span></p>
			</div>
			<div class="card">
				<h2>Gyroscópio</h2>
				<p id="gyroscope">-- | -- | -- °/s</p>
			</div>
			<div class="card">
				<h2>Aceleração</h2>
				<p id="acceleration">-- | -- | -- m/s²</p>
			</div>
		</div>
	</div>
	<div class="buttons">
		<div class="button disabled"></div>
		<button onclick="sendMessage('forward')">Avançar</button>
		<div class="button disabled"></div>
		<button onclick="sendMessage('left')">Esquerda</button>
		<button onclick="sendMessage('stop')">Parar</button>
		<button onclick="sendMessage('right')">Direita</button>
		<div class="button disabled"></div>
		<button onclick="sendMessage('backward')">Recuar</button>
		<div class="button disabled"></div>
	</div>

	<script>
		if (!window.WebSocket) {
			alert('Seu navegador não suporta WebSockets. Por favor, use um navegador moderno como Chrome, Firefox ou Edge.');
			async function fetchData() {
				try {
					const res = await fetch('/data');
					if (!res.ok) {
						throw new Error('Erro ao buscar dados: ' + data.message);
					}
					console.log('Dados recebidos:', res.status, res);
					const data = await res.json();
					if (!data || !data.motorD) {
						throw new Error('Dados inválidos recebidos');
					}

					document.getElementById('motorD').innerHTML = data.motorD.rpm;
					document.getElementById('motorE').innerHTML = data.motorE.rpm;

					if (data.isMoving) {
						document.getElementById('direction').innerHTML = data.movement;
					} else {
						document.getElementById('direction').innerHTML = 'Parado';
					}
					document.getElementById('counters').innerHTML = data.motorD.pidOutput + ' | ' + data.motorE.pidOutput;

					let mpu = data.MPU6050;
					document.getElementById('gyroscope').innerHTML = mpu.gyroX + ' | ' + mpu.gyroY + ' | ' + mpu.gyroZ + ' °/s';
					document.getElementById('acceleration').innerHTML = mpu.accX + ' | ' + mpu.accY + ' | ' + mpu.accZ + ' m/s²';
				} catch (err) {
					console.error('Erro ao buscar dados:', err);
				}
			}

			document.getElementsByClassName('buttons')[0].style.display = 'none'; // Esconde os botões se WebSocket não estiver disponível
			document.getElementById('speed').innerHTML = 'WebSocket não suportado. Atualizando via HTTP...';
			// Atualiza a cada 5 segundos
			fetchData();
			setInterval(fetchData, 5000);
		} else {
			const gateway = `ws://${window.location.hostname}/car`;
			let websocket;
			let attempts = 0;

			function initWebSocket() {
				console.log('Tentando abrir uma conexão WebSocket...');
				websocket = new WebSocket(gateway);
				websocket.onopen = onOpen;
				websocket.onclose = onClose;
				websocket.onmessage = onMessage;
				websocket.onerror = function(event) {
					console.error('Erro na conexão WebSocket:', event);
					document.getElementById('speed').innerHTML = 'Erro na conexão. Tentando reconectar...';
				};
				attempts++;
				if (attempts > 5) {
					document.getElementById('speed').innerHTML = 'Muitas tentativas de conexão. Verifique o ESP32.';
					return;
				}
			}

			function onOpen(event) {
				console.log('Conexão aberta.');
				document.getElementById('speed').innerHTML = 'Conectado ao ESP32!';
				// setTimeout(function () {
				// 	websocket.send("status");
				// }, 1000);
			}

			function onClose(event) {
				console.log('Conexão fechada.');
				document.getElementById('speed').innerHTML = 'Desconectado. Tentando reconectar em 2 segundos...';
				websocket = null;
				if (attempts <= 5) {
					console.log('Tentando reconectar...');
				} else {
					console.error('Muitas tentativas de conexão. Verifique o ESP32.');
					document.getElementById('speed').innerHTML = 'Muitas tentativas de conexão. Verifique o ESP32.';
					return;
				}
				setTimeout(initWebSocket, 2000);
			}

			function onMessage(event) {
				console.log('Mensagem recebida:', event.data);
				const data = JSON.parse(event.data);

				if (data.ready) {
					document.getElementById('speed').innerHTML = 'Conectado ao ESP32!';
					setTimeout(() => {
						sendMessage("status");
					}, 1000);
				}
				if (data.status) {
					$("#direction").html(data.status === 'stopped' ? 'Parado' : (data.direction || 'Desconhecido'));
				}
				if (data.motorD) {
					$("#motorD").html(data.motorD.rpm || '--');
					$("#counterD").html(data.motorD.pidOutput || '--');
				} else {
					$("#motorD").html('--');
					$("#counterD").html('--');
				}
				if (data.motorE) {
					$("#motorE").html(data.motorE.rpm || '--');
					$("#counterE").html(data.motorE.pidOutput || '--');
				} else {
					$("#motorE").html('--');
					$("#counterE").html('--');
				}
				if (data.gyro) {
					$("#gyroscope").html(`${data.gyro.x || '--'} | ${data.gyro.y || '--'} | ${data.gyro.z || '--'} °/s`);
				} else {
					$("#gyroscope").html('-- | -- | -- °/s');
				}
				if (data.accel) {
					$("#acceleration").html(`${data.accel.x || '--'} | ${data.accel.y || '--'} | ${data.accel.z || '--'} m/s²`);
				} else {
					$("#acceleration").html('-- | -- | -- m/s²');
				}
			}

			function sendMessage(command) {
				if (websocket && websocket.readyState === WebSocket.OPEN) {
					websocket.send(command);
				} else {
					console.error('WebSocket não está aberto. Comando não enviado:', command);
				}
			}

			window.addEventListener('load', initWebSocket);
		}
	</script>
</body>
</html>
