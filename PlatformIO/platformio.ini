; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Carrinho_ESP32-Platformio]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

upload_speed = 921600
monitor_speed = 115200

build_flags = -Iinclude
; -D PIO_FRAMEWORK_ARDUINO_LITTLEFS_DISABLED

lib_deps = 
	esp32async/AsyncTCP@^3.4.4
	me-no-dev/ESPAsyncWebServer@^3.6.0
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit_VL53L0X@^1.2.4
	adafruit/Adafruit Unified Sensor@^1.1.15

lib_ldf_mode = deep+
lib_extra_dirs =
	lib
	~/Arduino/libraries

board_build.filesystem = spiffs

[env:Carrinho_ESP32-Platformio-OTA]
extends = env:Carrinho_ESP32-Platformio
build_flags =
	-Iinclude

upload_protocol = espota
upload_port = espcarrinho.local
upload_speed = 115200
monitor_port = espcarrinho.local
monitor_speed = 115200